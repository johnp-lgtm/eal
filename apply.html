<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply — Easy As Loans</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#48206E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="apply.css" />

  <!-- Meta Pixel init only (no PageView here); Lead is fired on successful submit -->
  <script src="/pixel.js" data-pv="0"></script>
</head>
<body class="apply-page">

  <header class="apply-top">
    <div class="container">
      <a href="index.html" class="logo" aria-label="Easy As Loans home"><img class="logo-img" src="assets/logo.png" alt="Easy As Loans" /></a>
      <a href="index.html" class="apply-exit">&times;&nbsp; Exit</a>
    </div>
  </header>

  <div class="apply-mobilebar">
    <div class="mb-row"><span class="js-mb-label">Loan</span><span class="js-mb-count">Step 1</span></div>
    <div class="mb-track"><div class="mb-fill js-mb-fill" style="width:20%"></div></div>
  </div>

  <div class="apply-wrap">
    <aside class="apply-side">
      <button type="button" class="apply-back js-back">&larr; Back</button>
      <ol class="apply-steps js-steps"></ol>
      <div class="apply-help">
        <p class="apply-help-h">Need help?</p>
        <a class="apply-help-num" href="tel:+61402083863">0402 083 863</a>
      </div>
    </aside>

    <main class="apply-main">
      <div class="js-step-root"></div>
    </main>
  </div>

  <script src="apply.js"></script>
</body>
</html>
