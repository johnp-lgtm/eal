# Cloudflare Pages configuration for Easy As Loans
# (hosts the website, the /api/leads function, and the leads database)
# See CRM-SETUP.md for full step-by-step instructions.

name = "easyasloans"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# Leads database (Cloudflare D1). After you create the database, paste its
# ID below (or bind it in the Cloudflare dashboard under Settings → Functions).
[[d1_databases]]
binding = "DB"
database_name = "easyasloans-leads"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Environment variables ADMIN_PASSWORD, RESEND_API_KEY, LEAD_EMAIL_TO and
# LEAD_EMAIL_FROM are set as encrypted secrets in the dashboard or with
# `wrangler pages secret put NAME` — never commit them to the repo.
